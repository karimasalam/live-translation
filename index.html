<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Speech Translation</title>
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      padding: 0;
      background: #0838CC;
      /* vivid blue */
      color: #ffea00;
      /* brighter yellow */
    }

    header {
      background: #0838CC;
      color: inherit;
      padding: 1rem 2rem;
      text-align: center;
    }

    main {
      margin: 2rem auto;
      background: transparent;
      padding: 2rem;
      border-radius: 8px;
      box-shadow: none;
    }

    .controls {
      display: flex;
      gap: 1rem;
      margin-bottom: 1rem;
      flex-wrap: wrap;
    }

    select,
    button {
      padding: 0.5rem 1rem;
      font-size: 1rem;
      color: inherit;
      background: rgba(0, 0, 0, 0.1);
      border: 1px solid #ffea00;
      border-radius: 6px;
    }

    button:hover {
      background: rgba(0, 0, 0, 0.2);
    }

    .transcript,
    .translation {
      border: 1px solid #ffea00;
      border-radius: 6px;
      padding: 1rem;
      min-height: 5rem;
      white-space: pre-wrap;
      background: transparent;
    }

    .translation {
      max-height: 80vh !important;
      min-height: 80vh !important;
      overflow-y: auto;
    }

    .translation p {
      font-size: 200%;
      font-weight: bold;
      margin: 0 0 .75rem;
      line-height: 1.4;

    }

    .collapse-toggle {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 1000;
    }

    body.collapsed header,
    body.collapsed .controls,
    body.collapsed .transcript,
    body.collapsed .label {
      display: none;
    }

    .label {
      font-weight: bold;
      margin-top: 1rem;
      margin-bottom: 0.25rem;
      display: block;
    }
  </style>
</head>

<body>
  <header>
    <h1>Live Speech Transcription & Translation</h1>
  </header>
  <main>
    <div id="root"></div>
  </main>

  <!-- React CDN -->
  <script crossorigin src="https://unpkg.com/react@17/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    function App() {
      const [sourceLang, setSourceLang] = useState('ur-PK');
      const [targetLang, setTargetLang] = useState('en');
      const [listening, setListening] = useState(false);
      const [finalText, setFinalText] = useState('');
      const [interimText, setInterimText] = useState('');
      const [chunks, setChunks] = useState([]);
      const [interimTranslation, setInterimTranslation] = useState('');
      const [showTranscript, setShowTranscript] = useState(false);
      const [collapsed, setCollapsed] = useState(true);
      const listeningRef = useRef(listening);
      const sourceLangRef = useRef(sourceLang);
      const targetLangRef = useRef(targetLang);
      const translationRef = useRef(null);
      const recognitionRef = useRef(null);
      const translateTimeoutRef = useRef(null);
      const abortControllerRef = useRef(null);

      useEffect(() => {
        listeningRef.current = listening;
      }, [listening]);

      useEffect(() => {
        sourceLangRef.current = sourceLang;
      }, [sourceLang]);

      useEffect(() => {
        targetLangRef.current = targetLang;
      }, [targetLang]);

      useEffect(() => {
        document.body.classList.toggle('collapsed', collapsed);
      }, [collapsed]);

      useEffect(() => {
        if (recognitionRef.current) {
          recognitionRef.current.lang = sourceLang;
        }
      }, [sourceLang]);

      useEffect(() => {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
          alert('Your browser does not support Speech Recognition API');
          return;
        }
        const recognition = new SpeechRecognition();
        recognition.interimResults = true;
        recognition.continuous = true;

        recognition.onresult = (event) => {
          let finalChunk = '';
          let interimChunk = '';
          for (let i = event.resultIndex; i < event.results.length; ++i) {
            const res = event.results[i];
            if (res.isFinal) {
              finalChunk += res[0].transcript;
            } else {
              interimChunk += res[0].transcript;
            }
          }
          if (finalChunk) {
            clearTimeout(translateTimeoutRef.current);
            if (abortControllerRef.current) {
              abortControllerRef.current.abort();
            }
            setFinalText((prev) => `${prev} ${finalChunk}`.trim());
            setInterimText('');
            translateText(finalChunk);
          }
          if (interimChunk) {
            //Removed interim to avoid excessive calls
            //clearTimeout(translateTimeout);
            //translateTimeout = setTimeout(() => {
            //translateText(interimChunk, true);
            //}, 500);
            setInterimText(interimChunk);
          }
        };

        recognition.onerror = (e) => console.error('Speech recognition error', e);
        recognition.onend = () => {
          if (listeningRef.current) recognition.start();
        };

        recognitionRef.current = recognition;
      }, []);

      useEffect(() => {
        if (translationRef.current) {
          translationRef.current.scrollTop = translationRef.current.scrollHeight;
        }
      }, [chunks, interimTranslation]);

      const translateText = async (text, replace = false) => {
        try {
          const safeText = text.length > 450 ? text.slice(-450) : text;
          const src = sourceLangRef.current.split('-')[0];
          const trg = targetLangRef.current.split('-')[0];
          const params = new URLSearchParams({
            langpair: `${src}|${trg}`,
            q: safeText,
            mt: '1',
            onlyprivate: '0',
            de: 'a@b.c'
          });

          const apiKey = new URLSearchParams(window.location.search).get('apiKey') || 'PLEASE_INPUT_YOUR_KEY';

          // Create new AbortController for this request
          if (replace) {
            if (abortControllerRef.current) {
              abortControllerRef.current.abort();
            }
            abortControllerRef.current = new AbortController();
          }

          const res = await fetch(`https://translated-mymemory---translation-memory.p.rapidapi.com/get?${params.toString()}`,
            {
              method: 'GET',
              headers: {
                'x-rapidapi-key': apiKey,
                'x-rapidapi-host': 'translated-mymemory---translation-memory.p.rapidapi.com'
              },
              signal: replace ? abortControllerRef.current.signal : undefined
            }
          );
          const data = await res.json();
          const translated = data.responseData ? data.responseData.translatedText : (data.translatedText || '');
          if (replace) {
            setInterimTranslation(translated);
          } else {
            setChunks((prev) => [...prev, translated]);
            setInterimTranslation('');
          }
        } catch (err) {
          if (err.name === 'AbortError') {
            console.log('Translation request cancelled');
          } else {
            console.error('Translation error', err);
          }
        }
      };

      const toggleListening = () => {
        if (!recognitionRef.current) return;
        if (!listening) {
          recognitionRef.current.lang = sourceLang;
          recognitionRef.current.start();
        } else {
          recognitionRef.current.stop();
        }
        setListening((prev) => !prev);
      };

      const resetAll = () => {
        if (listening && recognitionRef.current) {
          recognitionRef.current.stop();
        }
        setListening(false);
        setFinalText('');
        setInterimText('');
        setChunks([]);
        setInterimTranslation('');
      };

      return (
        <div>
          <button className="collapse-toggle" onClick={() => setCollapsed((c) => !c)}>
            {collapsed ? 'Show UI' : 'Hide UI'}
          </button>
          <button style={{ position: 'fixed', top: '10px', right: '110px', zIndex: 1000 }} onClick={toggleListening}>
            {listening ? 'Stop' : 'Start'} Listening
          </button>
          <div className="controls">
            <label>
              Source Language:&nbsp;
              <select value={sourceLang} onChange={(e) => setSourceLang(e.target.value)}>
                <option value="ur-PK">Urdu</option>
                <option value="ar-SA">Arabic</option>
                <option value="en">English</option>
              </select>
            </label>
            <label>
              Target Language:&nbsp;
              <select value={targetLang} onChange={(e) => setTargetLang(e.target.value)}>
                <option value="en">English</option>
                <option value="ur-PK">Urdu</option>
                <option value="ar-SA">Arabic</option>
              </select>
            </label>
            <button onClick={resetAll}>
              Reset
            </button>
          </div>
          <div>
            <span className="label">
              Transcript ({sourceLang}):
              <button style={{ marginLeft: '0.5rem' }} onClick={() => setShowTranscript((s) => !s)}>
                {showTranscript ? 'Hide' : 'Show'}
              </button>
            </span>
            {showTranscript && (
              <div className="transcript">{`${finalText}${interimText ? ` [interim] ${interimText}` : ''}`}</div>
            )}
          </div>
          <div>
            <span className="label">Translation ({targetLang}):</span>
            <div className="translation" ref={translationRef}>{chunks.map((c, i) => <p key={i}>{c}</p>)}{interimTranslation && <p style={{ opacity: 0.6 }}>{interimTranslation}</p>}</div>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>

</html>
